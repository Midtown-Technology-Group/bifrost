# CI-based analysis only. The runbook records the verified cutover and archived
# automatic-analysis configuration for rollback.
sonar.projectKey=Midtown-Technology-Group_bifrost
sonar.host.url=https://sonarcloud.io
sonar.sourceEncoding=UTF-8
# Inventory is tracked explicitly; gitignore must not hide authored source.
sonar.scm.exclusions.disabled=true
sonar.python.version=3.14

# Include authored repository tooling, including .github/scripts and release
# code, rather than limiting the scan to api, apps and client/src.
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/tests/**,**/test/**,**/*.test.*,**/*.spec.*,**/test_*.py,**/*_test.py,**/conftest.py,client/e2e/**
# Exclusions are tests, installed/build outputs, and generated skill/type mirrors.
# .claude/skills contains the maintained originals; the two excluded skill trees
# are checked mirrors. No authored API, CLI, proxy, worker or release exclusions.
sonar.exclusions=**/.git/**,**/tests/**,**/test/**,**/*.test.*,**/*.spec.*,**/test_*.py,**/*_test.py,**/conftest.py,client/e2e/**,**/node_modules/**,**/.venv/**,**/venv/**,**/__pycache__/**,**/dist/**,**/build/**,**/coverage/**,.sonar-evidence/**,.agents/skills/**,plugins/bifrost/skills/**,skills/build/**,skills/setup/**,skills/migrate/**,skills/copilot-cowork-package/**,client/src/lib/v1.d.ts
sonar.test.exclusions=**/.git/**,**/node_modules/**,**/.venv/**,**/venv/**,**/__pycache__/**,**/dist/**,**/build/**,**/coverage/**,.sonar-evidence/**,.agents/skills/**,plugins/bifrost/skills/**,skills/build/**,skills/setup/**,skills/migrate/**,skills/copilot-cowork-package/**
# Never substitute API badge coverage: its deliberate omissions differ from
# the repository-wide Sonar denominator. Preflight owns these normalized files.
sonar.python.coverage.reportPaths=.sonar-evidence/python.xml
sonar.javascript.lcov.reportPaths=.sonar-evidence/client.lcov,.sonar-evidence/node.lcov
sonar.qualitygate.wait=true
