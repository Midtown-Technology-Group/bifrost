name: Search responsiveness diagnostic (experiment only)

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: search-responsiveness-diagnostic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Record source and boot isolated test stack
        run: |
          git rev-parse HEAD | tee /tmp/search-diagnostic-source.txt
          ./test.sh stack up
      - name: Replay all 43 historical prefix files with diagnostic stack watchdog
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          vmstat -t 1 > /tmp/search-replay-vmstat.txt &
          host_monitor=$!
          python3 scripts/memory_sampler.py --interval 0.5 --out /tmp/search-replay-memory.csv &
          memory_monitor=$!
          (for i in $(seq 1 180); do date -u +%FT%T.%NZ; docker stats --no-stream --format '{{json .}}'; done) > /tmp/search-replay-cpu.txt &
          cpu_monitor=$!
          trap 'kill "$host_monitor" "$memory_monitor" "$cpu_monitor"; wait "$host_monitor" "$memory_monitor" "$cpu_monitor" || true' EXIT
          mapfile -t prefix_files < scripts/search-responsiveness-historical-prefix.txt
          ./test.sh "${prefix_files[@]}" -s -v --durations=0 | tee /tmp/search-replay.log
      - name: Upload diagnostic evidence without changing the test threshold
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: search-responsiveness-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            /tmp/search-diagnostic-source.txt
            /tmp/search-isolated*
            /tmp/search-replay*
            /tmp/bifrost-*/*.log
            /tmp/bifrost-*/test-results.xml
          if-no-files-found: error
          retention-days: 14
      - name: Tear down task-created test resources
        if: always()
        run: ./test.sh stack down
