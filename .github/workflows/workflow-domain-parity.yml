name: Workflow domain differential parity

on:
  # Enables one supported pre-publication candidate run; never default main push.
  push:
    branches: [test/workflow-domain-parity]
  pull_request:
    branches: [main, rust/core-mvp-baseline, rust/core-parity-lane]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workflow-domain-parity-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  parity:
    if: github.repository == 'Midtown-Technology-Group/bifrost'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Actual Python and Rust domain comparison
        run: bash scripts/ci/workflow-domain-parity.sh
      - name: Preserve scoped evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: workflow-domain-parity-evidence
          path: /tmp/bifrost-*/workflow-domain-parity
          if-no-files-found: error
          retention-days: 14
