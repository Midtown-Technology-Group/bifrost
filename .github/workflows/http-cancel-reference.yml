name: HTTP cancellation reference
on:
  push:
    branches: [test/http-cancel-reference]
    paths:
      - api/tests/e2e/api/test_http_cancel_reference.py
      - scripts/ci/http-cancel-reference.sh
      - .github/workflows/http-cancel-reference.yml
  pull_request:
    paths:
      - api/tests/e2e/api/test_http_cancel_reference.py
      - scripts/ci/http-cancel-reference.sh
      - .github/workflows/http-cancel-reference.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run unchanged HTTP cancellation reference
        run: bash scripts/ci/http-cancel-reference.sh
      - name: Require a safe evidence locator
        if: always() && env.HTTP_CANCEL_REFERENCE_EVIDENCE == ''
        run: exit 1
      - name: Retain only safe finite evidence
        if: always() && env.HTTP_CANCEL_REFERENCE_EVIDENCE != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: http-cancel-reference-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.HTTP_CANCEL_REFERENCE_EVIDENCE }}/receipt.json
            ${{ env.HTTP_CANCEL_REFERENCE_EVIDENCE }}/projected-tests.xml
            ${{ env.HTTP_CANCEL_REFERENCE_EVIDENCE }}/owned-resources.json
            ${{ env.HTTP_CANCEL_REFERENCE_EVIDENCE }}/source-hashes.json
            ${{ env.HTTP_CANCEL_REFERENCE_EVIDENCE }}/installed-identities.json
          if-no-files-found: error
          retention-days: 14
