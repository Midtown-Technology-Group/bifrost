name: Isolated runtime owner schema candidate
on:
  push:
    branches: [spike/go-first-class-g0]
    paths:
      - api/alembic/versions/20261009_runtime_deployment_artifacts.py
      - api/alembic/versions/20261010_runtime_owner_sessions.py
      - api/alembic/versions/20261010_runtime_starts_receipts.py
      - api/alembic/versions/20261010_runtime_sdk_grants.py
      - api/alembic/versions/20261010_runtime_admissions.py
      - api/alembic/versions/20261010_runtime_identity_fences.py
      - api/tests/e2e/platform/test_runtime_deployment_artifacts.py
      - api/src/models/orm/runtime_execution.py
      - api/src/models/orm/executions.py
      - api/src/models/orm/workflows.py
      - api/alembic/env.py
      - docker-compose.test.yml
      - api/tests/unit/test_issue_skill_shell_safety.py
      - api/tests/contract/test_object_storage_contract.py
      - api/tests/e2e/platform/test_object_storage_signed_url_transport.py
      - .github/workflows/runtime-owner-isolated-spike.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  schema:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Actual migrated platform database and scoped repository test lane
        run: |
          set -euo pipefail
          git rev-parse HEAD > "$RUNNER_TEMP/runtime-schema-source.txt"
          source scripts/lib/test_helpers.sh
          task_project="$(compute_project_name .)"
          cleanup_schema_stack() {
            task_original_status=$?
            trap - EXIT
            if ! bash test.sh stack down > "$RUNNER_TEMP/runtime-schema-cleanup.log" 2>&1; then
              exit 1
            fi
            task_containers="$(docker ps -a --filter "label=com.docker.compose.project=$task_project" --format '{{.ID}}')"
            task_networks="$(docker network ls --filter "label=com.docker.compose.project=$task_project" --format '{{.ID}}')"
            task_volumes="$(docker volume ls --filter "label=com.docker.compose.project=$task_project" --format '{{.Name}}')"
            if [[ -n "$task_containers" || -n "$task_networks" || -n "$task_volumes" ]]; then
              printf 'Residual task resources: containers=%s networks=%s volumes=%s\n' "$task_containers" "$task_networks" "$task_volumes" >> "$RUNNER_TEMP/runtime-schema-cleanup.log"
              exit 1
            fi
            printf 'Verified empty container, network and volume inventories for %s\n' "$task_project" >> "$RUNNER_TEMP/runtime-schema-cleanup.log"
            exit "$task_original_status"
          }
          task_initial_containers="$(docker ps -a --filter "label=com.docker.compose.project=$task_project" --format '{{.ID}}')"
          task_initial_networks="$(docker network ls --filter "label=com.docker.compose.project=$task_project" --format '{{.ID}}')"
          task_initial_volumes="$(docker volume ls --filter "label=com.docker.compose.project=$task_project" --format '{{.Name}}')"
          [[ -z "$task_initial_containers" && -z "$task_initial_networks" && -z "$task_initial_volumes" ]]
          trap cleanup_schema_stack EXIT
          bash test.sh stack up > "$RUNNER_TEMP/runtime-schema-stack.log" 2>&1
          bash test.sh unit --durations=0 > "$RUNNER_TEMP/runtime-schema-unit-tests.log" 2>&1
          cp /tmp/bifrost-*/test-results.xml "$RUNNER_TEMP/runtime-schema-unit-results.xml"
          bash test.sh tests/e2e/platform/test_runtime_deployment_artifacts.py \
            tests/e2e/platform/test_object_storage_signed_url_transport.py \
            tests/e2e/platform/test_execution_history_pagination.py \
            tests/unit/models/test_execution_attempts_contract.py \
            tests/unit/services/execution/test_attempts.py --durations=0 \
            > "$RUNNER_TEMP/runtime-schema-tests.log" 2>&1
          bash test.sh quality api > "$RUNNER_TEMP/runtime-schema-quality.log" 2>&1
      - name: Retain exact candidate evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-owner-schema-${{ github.sha }}
          path: |
            ${{ runner.temp }}/runtime-schema-stack.log
            ${{ runner.temp }}/runtime-schema-source.txt
            ${{ runner.temp }}/runtime-schema-unit-tests.log
            ${{ runner.temp }}/runtime-schema-unit-results.xml
            ${{ runner.temp }}/runtime-schema-tests.log
            ${{ runner.temp }}/runtime-schema-quality.log
            ${{ runner.temp }}/runtime-schema-cleanup.log
            /tmp/bifrost-*/test-results.xml
          if-no-files-found: error
          retention-days: 14
