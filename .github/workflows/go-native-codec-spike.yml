name: Go proposed runtime codec diagnostic
on:
  push:
    branches: [spike/go-first-class-g0]
    paths:
      - spikes/go-native/executionprofile/**
      - spikes/go-native/runtimecontrol/**
      - spikes/go-native/cmd/executioncheck/**
      - spikes/go-native/scripts/execution-interchange.py
      - spikes/go-native/scripts/rust-execution-check.sh
      - spikes/go-native/scripts/profile-peer-*
      - spikes/go-native/peers/**
      - .github/workflows/go-native-codec-spike.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  trusted-codec:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.27.1
          cache: false
      - name: Offline trusted codec tests and vet on disposable hosted VM
        working-directory: spikes/go-native
        run: |
          mkdir -p "$RUNNER_TEMP/codec-evidence" "$RUNNER_TEMP/codec-home" "$RUNNER_TEMP/codec-cache"
          git rev-parse HEAD > "$RUNNER_TEMP/codec-evidence/source-sha.txt"
          go version > "$RUNNER_TEMP/codec-evidence/go-version.txt"
          cp executionprofile/testdata/provenance.json "$RUNNER_TEMP/codec-evidence/proposal-provenance.json"
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/codec-home" GOCACHE="$RUNNER_TEMP/codec-cache" \
            GOTOOLCHAIN=local GOWORK=off GOPROXY=off GOSUMDB=off CGO_ENABLED=0 \
            go test -mod=readonly -json -count=1 ./runtimecontrol ./executionprofile \
            > "$RUNNER_TEMP/codec-evidence/tests.jsonl"
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/codec-home" GOCACHE="$RUNNER_TEMP/codec-cache" \
            GOTOOLCHAIN=local GOWORK=off GOPROXY=off GOSUMDB=off CGO_ENABLED=0 \
            go vet -mod=readonly ./runtimecontrol ./executionprofile ./cmd/executioncheck
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/codec-home" GOCACHE="$RUNNER_TEMP/codec-cache" \
            GOTOOLCHAIN=local GOWORK=off GOPROXY=off GOSUMDB=off CGO_ENABLED=0 \
            go build -mod=readonly -trimpath -buildvcs=false \
            -o "$RUNNER_TEMP/codec-evidence/executioncheck" ./cmd/executioncheck
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Midtown-Technology-Group/bifrost
          ref: 35daf020d5e1286f82bdfed6bb3fc537bf3d78f6
          path: .profile-reference
          persist-credentials: false
      - name: Install only the hashed reference-oracle wheel closure
        run: |
          python3 -m venv "$RUNNER_TEMP/profile-python"
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/codec-home" \
            "$RUNNER_TEMP/profile-python/bin/python" -m pip --isolated install \
            --index-url https://pypi.org/simple --only-binary=:all: --no-deps \
            --require-hashes -r spikes/go-native/scripts/profile-peer-requirements.lock
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/codec-home" \
            "$RUNNER_TEMP/profile-python/bin/python" -m pip check
      - name: Independent Python stream codec tests
        run: |
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/codec-home" \
            "$RUNNER_TEMP/profile-python/bin/python" spikes/go-native/peers/test_execution_codec.py \
            > "$RUNNER_TEMP/codec-evidence/python-stream-tests.txt" 2>&1
      - name: Isolated independent Rust codec checks
        run: bash spikes/go-native/scripts/rust-execution-check.sh "$RUNNER_TEMP/codec-evidence"
      - name: Actual Go, Python and Rust proposed-profile encoding checks
        run: |
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/codec-home" \
            "$RUNNER_TEMP/profile-python/bin/python" spikes/go-native/scripts/execution-interchange.py \
            .profile-reference "$RUNNER_TEMP/codec-evidence/executioncheck" "$RUNNER_TEMP/codec-evidence" \
            "$RUNNER_TEMP/codec-evidence/rust-executioncheck"
          printf '%s\n' 'Trusted proposed-wire diagnostic: independent Go/Python/Rust codecs plus Python test oracle; no tenant run, session authority or durable finalization.' \
            > "$RUNNER_TEMP/codec-evidence/scope.txt"
      - name: Retain exact diagnostic evidence, including test failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-codec-diagnostic-${{ github.sha }}
          path: ${{ runner.temp }}/codec-evidence
          if-no-files-found: error
          retention-days: 14
