name: Bounded delivery policy

on:
  push:
    branches: [codex/bounded-release-policy]
  pull_request:
    branches: [main]
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      pull_request:
        description: PR number to evaluate read-only against protected main
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    name: Bounded delivery policy tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"
      - run: node --test .github/scripts/bounded-delivery-policy.test.mjs

  pre-pr:
    if: github.event_name == 'push'
    name: Bounded policy clean-candidate pre-PR
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"
      - name: Run exact clean-candidate gate
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash test.sh pre-pr 2>&1 | tee "$RUNNER_TEMP/bounded-policy-pre-pr.log"
      - name: Retain pre-PR log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bounded-policy-pre-pr-${{ github.sha }}
          path: ${{ runner.temp }}/bounded-policy-pre-pr.log
          if-no-files-found: error
          retention-days: 14

  shadow:
    if: >-
      github.repository == 'Midtown-Technology-Group/bifrost' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'pull_request_target' || github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request'))
    name: Bounded delivery shadow report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      checks: read
      actions: read
    steps:
      # GITHUB_SHA is the protected main commit on these events. Never execute
      # PR code, install its dependencies, or load its policy in this job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/bounded-delivery-policy.mjs
            .github/bounded-delivery-policy.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"
      - name: Observe eligibility without authorizing an action
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/bounded-delivery-policy.mjs
