name: Release PR

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Catch merges that arrived while the preceding release was packaging.
  workflow_run:
    workflows: [CI]
    types: [completed]

concurrency:
  group: release-pr
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  prepare:
    if: >-
      github.repository == 'Midtown-Technology-Group/bifrost' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.conclusion == 'success' &&
        startsWith(github.event.workflow_run.head_branch, 'v')))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare the complete reviewed release interval
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/release/automatic-release.py prepare
          # Never write an older preparation over a newer main merge.
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

      - name: Open or update the signed release PR
        if: steps.candidate.outputs.version != ''
        id: release_pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ github.token }}
          sign-commits: true
          branch: automation/release
          base: main
          delete-branch: false
          add-paths: |
            .claude-plugin/plugin.json
            .codex-plugin/plugin.json
            plugins/bifrost/.codex-plugin/plugin.json
            release/candidate.json
            release/notes.md
          commit-message: 'chore(release): prepare ${{ steps.candidate.outputs.version }}'
          title: 'chore(release): ${{ steps.candidate.outputs.version }}'
          body: |
            ## Release review

            This PR prepares `${{ steps.candidate.outputs.version }}` from exact
            source `${{ steps.candidate.outputs.source }}`. Review the retained
            `release/candidate.json` interval, bump and `release/notes.md`.
            Edit the notes to identify verified security fixes and upgrade steps.

            A human maintainer must approve this exact PR head and an admin must
            enqueue it through the normal native merge queue. This workflow does
            not enqueue or merge it. If main advances outside the reviewed release
            interval, refresh this PR before merging.

            After exact main CI passes, Release tag verifies the signed source,
            approved PR, manifests and candidate; it tags that commit and explicitly
            dispatches CI on the immutable tag. CI tests, signs and publishes the
            packages and immutable GitHub Release. Production deployment remains
            separately authorized through bifrost-infra.

            ## Recovery

            For stale candidates, rerun Release PR and review its new head.
            For publication failures, read back the tag and CI run before retrying.
            Never move a tag or replace a published immutable release.

      - name: Require verified signed PR commits
        if: steps.release_pr.outputs.pull-request-number != ''
        env:
          PR_OUTPUTS: ${{ toJson(steps.release_pr.outputs) }}
        run: |
          set -euo pipefail
          test "$(printf '%s' "$PR_OUTPUTS" | jq -r '."pull-request-commits-verified"')" = true

      - name: Start approval-required PR checks as the trusted workflow
        if: steps.release_pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.release_pr.outputs.pull-request-number }}
        run: |
          set -euo pipefail
          head_sha="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)"
          deadline=$((SECONDS + 120))
          while true; do
            runs="$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$head_sha&event=pull_request&per_page=100")"
            ci_count="$(printf '%s' "$runs" | jq '[.[].workflow_runs[] | select(.path == ".github/workflows/ci.yml")] | length')"
            if [ "$ci_count" -gt 0 ]; then
              while IFS= read -r run_id; do
                [ -n "$run_id" ] || continue
                gh run rerun "$run_id" --repo "$GITHUB_REPOSITORY"
              done < <(printf '%s' "$runs" | jq -r '.[].workflow_runs[] | select(.conclusion == "action_required") | .id')
              break
            fi
            if (( SECONDS >= deadline )); then
              echo 'PR checks not observed. Inspect the exact PR head; do not bypass checks.' >&2
              exit 1
            fi
            sleep 2
          done
