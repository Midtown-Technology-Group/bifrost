name: Go native bounded spike
on:
  push:
    branches: [spike/go-first-class-g0]
    paths: [spikes/go-native/**, .github/workflows/go-native-spike.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Isolated tests, build, local execution and measurements
        run: bash spikes/go-native/scripts/measure.sh "$RUNNER_TEMP/go-spike-evidence"
      - name: Retain exact evidence, including failure diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-native-spike-${{ github.sha }}
          path: ${{ runner.temp }}/go-spike-evidence
          if-no-files-found: error
          retention-days: 14
