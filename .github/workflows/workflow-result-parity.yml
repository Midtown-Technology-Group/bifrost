name: Reviewed workflow Result source formatting

on:
  push:
    branches: [test/workflow-result-parity]

permissions:
  contents: read

jobs:
  format:
    if: github.event.head_commit.message == 'ci: format reviewed workflow Result source'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Format a disposable copy of reviewed Result source
        run: bash scripts/ci/workflow-result-parity.sh format
      - name: Retain source patch and scoped disposal evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: workflow-result-format
          path: ${{ env.RESULT_FORMAT_ARTIFACTS }}
          if-no-files-found: error
          retention-days: 14
