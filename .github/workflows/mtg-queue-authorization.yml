name: MTG queue authorization

on:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read
  pull-requests: read

jobs:
  authorize:
    if: github.repository == 'Midtown-Technology-Group/bifrost'
    name: MTG Queue Authorization
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"
      - name: Test authorization policy
        run: node --test .github/scripts/authorize-merge-queue.test.mjs
      - name: Verify queue admission
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/authorize-merge-queue.mjs
