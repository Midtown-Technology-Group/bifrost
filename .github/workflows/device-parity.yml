name: Device protocol characterization

on:
  pull_request:
    branches: [main, rust/core-mvp-baseline, rust/core-parity-lane]
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: device-parity-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  CI_API_TEST_IMAGE: midtown-technology-group/bifrost-ci-api-dev
  CI_CLIENT_TEST_IMAGE: midtown-technology-group/bifrost-ci-client-dev
  CI_TEST_IMAGE_TAG: ${{ format('sha-{0}', github.sha) }}

jobs:
  reference:
    name: Python reference and parity drift detection
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Detect test image input changes
        id: test-image-inputs
        run: bash scripts/ci/detect-test-image-inputs.sh
      - name: Prepare supported test images
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API_IMAGE_CHANGED: ${{ steps.test-image-inputs.outputs.api_changed }}
          CLIENT_IMAGE_CHANGED: ${{ steps.test-image-inputs.outputs.client_changed }}
        run: bash api/scripts/ci/prepare-test-images.sh api client
      - name: Run committed reference and drift scenarios
        env:
          BIFROST_SKIP_BUILD: '1'
        run: |
          ./test.sh stack up
          ./test.sh parity
      - name: Stop isolated test stack
        if: always()
        run: ./test.sh stack down
      - name: Preserve sanitized reference observation
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: device-reference-${{ github.sha }}
          path: /tmp/bifrost-*/parity-lifecycle.json
          if-no-files-found: error
          retention-days: 14
