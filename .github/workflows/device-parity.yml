name: Device protocol characterization

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: device-parity-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  reference:
    name: Python reference and parity drift detection
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Detect test image input changes
        id: test-image-inputs
        run: bash scripts/ci/detect-test-image-inputs.sh
      - name: Prepare supported test images
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API_IMAGE_CHANGED: ${{ steps.test-image-inputs.outputs.api_changed }}
          CLIENT_IMAGE_CHANGED: ${{ steps.test-image-inputs.outputs.client_changed }}
        run: bash api/scripts/ci/prepare-test-images.sh api client
      - name: Run committed reference and drift scenarios
        env:
          BIFROST_SKIP_BUILD: '1'
        run: |
          ./test.sh stack up
          ./test.sh parity
      - name: Stop isolated test stack
        if: always()
        run: ./test.sh stack down
