# Dependabot auto-merge policy enforcement
#
# Policy (also documented in SECURITY.md):
#   - Security advisory bumps  → auto-merge when CI green (any semver level)
#   - Patch updates            → auto-merge when CI green
#   - Minor updates            → auto-merge when CI green
#   - Routine major updates    → suppressed by dependabot.yml
#   - Routine Docker updates   → suppressed by dependabot.yml
#
# Mechanism: enable GitHub auto-merge on the eligible PRs. Branch protection
# requires CI green before merge happens, so this never bypasses CI.

name: Dependabot auto-merge

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.repository != 'gobifrost/bifrost' && github.actor == 'dependabot[bot]'
    permissions:
      contents: write # required to enable auto-merge on the PR
      pull-requests: write # required to label and merge the PR
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
          alert-lookup: true

      - name: Require reviewed Python lockfile updates
        if: steps.metadata.outputs.package-ecosystem == 'pip'
        run: |
          changed_files="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" \
            --paginate --jq '.[].filename')"
          if grep -qx 'pyproject.toml' <<<"$changed_files" &&
             ! grep -qx 'requirements.lock' <<<"$changed_files"; then
            gh pr edit "$PR_URL" --add-label needs-review
            echo "::error::Python dependency PRs that change pyproject.toml must include a reviewed requirements.lock update."
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}

      - name: Auto-merge security advisory bumps (any semver level)
        if: steps.metadata.outputs.alert-state == 'OPEN'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Auto-merge non-major version updates (skip Docker)
        if: |
          steps.metadata.outputs.alert-state == '' &&
          steps.metadata.outputs.package-ecosystem != 'docker' &&
          (steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
           steps.metadata.outputs.update-type == 'version-update:semver-minor')
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # This catches an already-open PR or a manually recreated PR that predates
      # the conservative generation policy in dependabot.yml.
      - name: Label unexpected routine majors and Docker updates
        if: |
          steps.metadata.outputs.alert-state == '' &&
          (steps.metadata.outputs.update-type == 'version-update:semver-major' ||
           steps.metadata.outputs.package-ecosystem == 'docker')
        run: gh pr edit "$PR_URL" --add-label needs-review
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Upstream owns its GitHub App and PR-number Product Updates ledger.
  # Keep that write authority separate from MTG reviewed-lock automation.
  upstream-auto-merge:
    runs-on: ubuntu-latest
    # Metadata verifies the first signed Dependabot commit. App lockfile or
    # disposition follow-ups must also re-evaluate the current branch.
    if: github.repository == 'gobifrost/bifrost' && github.event.pull_request.user.login == 'dependabot[bot]'
    permissions:
      contents: read
      pull-requests: write # label majors/Docker; auto-merge itself uses the App token
    steps:
      - name: Checkout trusted automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      # Requires bifrost-lockfile-bot's Repository permission "Dependabot alerts"
      # at Read-only. An App owner updates https://github.com/organizations/
      # gobifrost/settings/apps/bifrost-lockfile-bot/permissions, then a
      # gobifrost organization owner must approve the installation's requested
      # permission increase before this runs.
      - name: Mint read-only GitHub App advisory token
        id: advisory-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.DEPENDABOT_LOCKFILE_APP_ID }}
          private-key: ${{ secrets.DEPENDABOT_LOCKFILE_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: read
          permission-pull-requests: read
          permission-vulnerability-alerts: read

      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: "${{ steps.advisory-token.outputs.token }}"

      - name: Resolve open Dependabot advisories
        id: advisory
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          UPDATED_DEPENDENCIES: ${{ steps.metadata.outputs.updated-dependencies-json }}
        with:
          github-token: ${{ steps.advisory-token.outputs.token }}
          script: |
            const { findOpenDependabotAlert } = require(`${process.env.GITHUB_WORKSPACE}/scripts/dependabot_alert_lookup.cjs`);
            const alertState = await findOpenDependabotAlert({
              github,
              repository: context.repo,
              pullNumber: context.payload.pull_request.number,
              dependencies: JSON.parse(process.env.UPDATED_DEPENDENCIES),
            });
            core.setOutput("alert-state", alertState);

      - name: Decide whether this PR auto-merges
        id: eligible
        env:
          ALERT_STATE: ${{ steps.advisory.outputs.alert-state }}
          ECOSYSTEM: ${{ steps.metadata.outputs.package-ecosystem }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
        run: |
          if [[ "$ALERT_STATE" == "OPEN" ]]; then
            echo "merge=true" >> "$GITHUB_OUTPUT"   # security advisory, any semver level
          elif [[ -z "$ALERT_STATE" && "$ECOSYSTEM" != "docker" && ( "$UPDATE_TYPE" == "version-update:semver-patch" || "$UPDATE_TYPE" == "version-update:semver-minor" ) ]]; then
            echo "merge=true" >> "$GITHUB_OUTPUT"   # non-major, non-Docker version update
          else
            echo "merge=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Mint GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.DEPENDABOT_LOCKFILE_APP_ID }}
          private-key: ${{ secrets.DEPENDABOT_LOCKFILE_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Record canonical dependency disposition
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          DEPENDABOT_ALERT_STATE: ${{ steps.advisory.outputs.alert-state }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const { recordDependabotDisposition } = require(`${process.env.GITHUB_WORKSPACE}/scripts/dependabot_product_updates.cjs`);
            await recordDependabotDisposition({
              github,
              repository: context.repo,
              number: context.payload.pull_request.number,
              alertState: process.env.DEPENDABOT_ALERT_STATE,
            });

      - name: Enable auto-merge (enters the merge queue once checks pass)
        if: steps.eligible.outputs.merge == 'true'
        run: gh pr merge --auto "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Label majors and Docker for human review
        if: |
          steps.metadata.outputs.update-type == 'version-update:semver-major' ||
          steps.metadata.outputs.package-ecosystem == 'docker'
        run: gh pr edit "$PR_URL" --add-label needs-review
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
