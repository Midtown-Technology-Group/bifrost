name: Rust domain formatting proposal

# Temporary source-editing evidence only; never a replacement correctness gate.
on:
  push:
    branches: [rust/workflow-format-proposal]

permissions:
  contents: read

jobs:
  formatting:
    if: github.repository == 'Midtown-Technology-Group/bifrost'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Retain exact source and format with the supported image
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/rust-domain-format"
          mkdir -p "$evidence"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          git rev-parse HEAD HEAD^{tree} > "$evidence/source.txt"
          sha256sum core-rs/crates/bifrost-domain/src/lib.rs core-rs/crates/bifrost-domain/src/workflow/mod.rs core-rs/crates/bifrost-domain/src/workflow/tests.rs > "$evidence/before.txt"
          docker build --target toolchain -t bifrost-rust-domain-format -f core-rs/Dockerfile core-rs
          docker image inspect bifrost-rust-domain-format --format '{{.Id}}' > "$evidence/image.txt"
          docker run --rm --mount "type=bind,src=$PWD/core-rs,dst=/workspace/core-rs" bifrost-rust-domain-format cargo fmt --package bifrost-domain
          git diff --check
          git diff --binary -- core-rs/crates/bifrost-domain/src > "$evidence/format.patch"
          sha256sum core-rs/crates/bifrost-domain/src/lib.rs core-rs/crates/bifrost-domain/src/workflow/mod.rs core-rs/crates/bifrost-domain/src/workflow/tests.rs > "$evidence/after.txt"
          test -z "$(git status --porcelain --untracked-files=all -- . ':!core-rs/crates/bifrost-domain/src')"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-domain-format-proposal
          path: ${{ runner.temp }}/rust-domain-format
          if-no-files-found: error
          retention-days: 7
