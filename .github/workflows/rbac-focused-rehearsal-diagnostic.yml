      - name: Verify the source and frozen test image still match
        if: ${{ always() && steps.image.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$DIAGNOSTIC_SOURCE_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          public = pathlib.Path(os.environ['RUNNER_TEMP']) / 'rbac-focused-public'
          expected = json.loads((public / 'image-identity.json').read_text())
          actual = subprocess.check_output(['docker', 'image', 'inspect', 'bifrost-test-api-dev:latest', '--format', '{{.Id}}'], text=True).strip()
          assert actual == expected['image_id'], 'Test image changed during the diagnostic'
          (public / 'source-readback.json').write_text(json.dumps({'source_sha': os.environ['DIAGNOSTIC_SOURCE_SHA'], 'clean_candidate': True, 'image_identity_unchanged': True}) + '\n')
          PY

      - name: Always tear down and verify only this job's owned test stack
        if: ${{ always() && steps.ownership.outcome == 'success' }}
        timeout-minutes: 5
        shell: bash
        env:
          OWNED_PROJECT: ${{ steps.ownership.outputs.compose_project }}
        run: |
          set -euo pipefail
          source scripts/lib/test_helpers.sh
          test "$OWNED_PROJECT" = "$(BIFROST_PROJECT_PREFIX=bifrost-test compute_project_name .)"
          set +e
          ./test.sh stack down
          cleanup_status=$?
          set -e
          export DIAGNOSTIC_CLEANUP_STATUS="$cleanup_status"
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          project = os.environ['OWNED_PROJECT']
          label = 'label=com.docker.compose.project=' + project
          commands = {'containers': ['docker', 'ps', '-aq', '--filter', label],
                      'volumes': ['docker', 'volume', 'ls', '-q', '--filter', label],
                      'networks': ['docker', 'network', 'ls', '-q', '--filter', label]}
          counts = {kind: len(subprocess.check_output(command, text=True).splitlines()) for kind, command in commands.items()}
          verified = os.environ['DIAGNOSTIC_CLEANUP_STATUS'] == '0' and not any(counts.values())
          data = {'source_sha': os.environ['DIAGNOSTIC_SOURCE_SHA'], 'compose_project': project,
                  'cleanup_exit_code': int(os.environ['DIAGNOSTIC_CLEANUP_STATUS']),
                  'remaining_owned_resource_counts': counts, 'cleanup_verified': verified}
          public = pathlib.Path(os.environ['RUNNER_TEMP']) / 'rbac-focused-public'
          (public / 'cleanup.json').write_text(json.dumps(data, sort_keys=True, indent=2) + '\n')
          assert verified, 'Owned test-stack cleanup could not be verified'
          PY

