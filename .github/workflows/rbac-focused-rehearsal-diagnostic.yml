      - name: Retain only sanitized unit result counts and failed test identities
        if: ${{ always() && steps.unit.outcome != 'skipped' && steps.ownership.outcome == 'success' }}
        shell: bash
        env:
          TEST_OUTCOME: ${{ steps.unit.outcome }}
          TEST_PROJECT: ${{ steps.ownership.outputs.compose_project }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, xml.etree.ElementTree as ET
          report = pathlib.Path('/tmp') / ('bifrost-' + os.environ['TEST_PROJECT']) / 'test-results.xml'
          data = {'source_sha': os.environ['DIAGNOSTIC_SOURCE_SHA'], 'outcome': os.environ['TEST_OUTCOME'],
                  'junit_present': report.is_file(), 'purpose': 'diagnostic-only-not-candidate-acceptance'}
          if report.is_file():
              root = ET.parse(report).getroot()
              suites = [root] if root.tag == 'testsuite' else list(root.iter('testsuite'))
              data['counts'] = {key: sum(int(s.get(key, '0')) for s in suites) for key in ('tests', 'failures', 'errors', 'skipped')}
              data['failed_tests'] = [{'classname': case.get('classname'), 'name': (case.get('name') or '').partition('[')[0]}
                  for case in root.iter('testcase') if case.find('failure') is not None or case.find('error') is not None]
          public = pathlib.Path(os.environ['RUNNER_TEMP']) / 'rbac-focused-public'
          (public / 'unit-summary.json').write_text(json.dumps(data, sort_keys=True, indent=2) + '\n')
