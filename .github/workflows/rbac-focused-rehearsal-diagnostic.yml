# TEMPORARY: remove this standalone diagnostic before the final PR.
# It neither satisfies nor changes normal CI, review, merge, or release gates.
name: RBAC Focused Rehearsal Diagnostic

on:
  workflow_dispatch:
  push:
    branches: [codex/upstream-rbac-sync-20261017]
    paths:
      - .github/workflows/rbac-focused-rehearsal-diagnostic.yml
      - api/**
      - client/src/lib/app-sdk/**
      - scripts/rehearse-mtg-rbac-*
      - scripts/lib/test_helpers.sh
      - scripts/stack_template_init.sh
      - test.sh
      - docker-compose.test.yml
      - pyproject.toml
      - requirements*.lock

permissions:
  contents: read

concurrency:
  group: rbac-focused-${{ github.ref }}
  cancel-in-progress: false

jobs:
  focused-rehearsal:
    if: github.repository == 'Midtown-Technology-Group/bifrost' && github.ref == 'refs/heads/codex/upstream-rbac-sync-20261017' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    # Same bound as the existing exact-source regeneration diagnostic. No retries.
    timeout-minutes: 60
    env:
      BIFROST_SKIP_BUILD: "1"
      DIAGNOSTIC_SOURCE_SHA: ${{ github.sha }}
    steps:
      - name: Checkout exact diagnostic source and frozen fork history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Establish isolated stack ownership and source identity
        id: ownership
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/codex/upstream-rbac-sync-20261017
          test "$(git rev-parse HEAD)" = "$DIAGNOSTIC_SOURCE_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          git cat-file -e '5085cc467ffb1ed35de9c9ca48890ab0d929e1d0^{commit}'
          source scripts/lib/test_helpers.sh
          project="$(BIFROST_PROJECT_PREFIX=bifrost-test compute_project_name .)"
          initial_containers="$(docker ps -aq --filter "label=com.docker.compose.project=$project")"
          initial_volumes="$(docker volume ls -q --filter "label=com.docker.compose.project=$project")"
          initial_networks="$(docker network ls -q --filter "label=com.docker.compose.project=$project")"
          test -z "$initial_containers"
          test -z "$initial_volumes"
          test -z "$initial_networks"
          printf 'compose_project=%s\n' "$project" >> "$GITHUB_OUTPUT"
          export DIAGNOSTIC_COMPOSE_PROJECT="$project"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, subprocess
          public = pathlib.Path(os.environ['RUNNER_TEMP']) / 'rbac-focused-public'
          public.mkdir()
          paths = (
              '.github/workflows/rbac-focused-rehearsal-diagnostic.yml',
              'api/Dockerfile.dev', 'docker-compose.test.yml', 'test.sh',
              'pyproject.toml', 'requirements.lock', 'requirements-pyright.lock',
              'api/product-updates.bundle.json', 'api/scripts/extract_mtg_rbac_rehearsal_proof.py',
              'scripts/rehearse-mtg-rbac-backup.sh', 'scripts/rehearse-mtg-rbac-backup.py',
              'scripts/rehearse-mtg-rbac-old-readers.sh', 'scripts/rehearse-mtg-rbac-old-readers.py',
          )
          workflow = pathlib.Path('.github/workflows/rbac-focused-rehearsal-diagnostic.yml').read_text()
          targets = re.findall(r'^\s+(tests/[^\s]+)\s+\\$', workflow, re.M)
          assert targets, 'No explicit focused test paths were found'
          assert all((pathlib.Path('api') / target).exists() for target in targets), 'A listed focused test path does not exist'
          data = {
              'focused_test_targets': targets,
              'purpose': 'diagnostic-only-not-candidate-acceptance',
              'source_sha': os.environ['DIAGNOSTIC_SOURCE_SHA'],
              'source_tree': subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(),
              'source_ref': os.environ['GITHUB_REF'],
              'run_id': os.environ['GITHUB_RUN_ID'], 'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'compose_project': os.environ['DIAGNOSTIC_COMPOSE_PROJECT'],
              'stack_predated_task': False, 'synthetic_data_only': True,
              'input_sha256': {name: hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest() for name in paths},
          }
          (public / 'source-identity.json').write_text(json.dumps(data, sort_keys=True, indent=2) + '\n')
          PY

      - name: Build the canonical test image from this checkout
        id: image
        shell: bash
        env:
          DOCKER_BUILDKIT: "1"
        run: |
          set -euo pipefail
          # This is the supported source-build fallback from prepare-test-images.sh.
          # No registry publication, privileged token, or mutable remote image reuse.
          docker build --file ./api/Dockerfile.dev --tag bifrost-test-api-dev:latest .
          test -z "$(git status --porcelain --untracked-files=all)"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          image_id = subprocess.check_output(
              ['docker', 'image', 'inspect', 'bifrost-test-api-dev:latest', '--format', '{{.Id}}'], text=True,
          ).strip()
          bundle = pathlib.Path('api/product-updates.bundle.json')
          data = {'source_sha': os.environ['DIAGNOSTIC_SOURCE_SHA'],
                  'image_tag': 'bifrost-test-api-dev:latest', 'image_id': image_id,
                  'producer': 'docker build --file ./api/Dockerfile.dev --tag bifrost-test-api-dev:latest .',
                  'committed_product_updates_bundle_sha256': hashlib.sha256(bundle.read_bytes()).hexdigest(),
                  'lane': 'dev-test-source-not-production-candidate'}
          public = pathlib.Path(os.environ['RUNNER_TEMP']) / 'rbac-focused-public'
          (public / 'image-identity.json').write_text(json.dumps(data, sort_keys=True, indent=2) + '\n')
          PY

      - name: Boot the owned canonical Linux Docker stack
        id: stack
        shell: bash
        run: |
          set -euo pipefail
          ./test.sh stack up

      - name: Rehearse fork-head backup, frozen readers, restore and full upgrade first
        id: backup
        shell: bash
        run: |
          set -euo pipefail
          public="$RUNNER_TEMP/rbac-focused-public"
          printf '%s\n' './test.sh rbac-backup-rehearsal' > "$public/backup-command.txt"
          trap 'result=$?; printf "%s\n" "$result" > "$RUNNER_TEMP/rbac-focused-public/backup-exit-code.txt"; exit "$result"' EXIT
          export BACKUP_PROJECT="${{ steps.ownership.outputs.compose_project }}"
          python3 - <<'PY'
          import json, os, pathlib, re, subprocess, time
          project = os.environ['BACKUP_PROJECT']
          assert re.fullmatch(r'bifrost-test-[0-9a-f]{8}', project)
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == os.environ['DIAGNOSTIC_SOURCE_SHA']
          root = pathlib.Path('/tmp') / ('bifrost-' + project)
          assert root.is_dir() and not root.is_symlink()
          assert not list(root.glob('rbac-backup-*')), 'A previous backup run exists in this owned stack'
          assert re.fullmatch(r'[0-9]{1,20}', os.environ['GITHUB_RUN_ID'])
          assert re.fullmatch(r'[0-9]{1,5}', os.environ['GITHUB_RUN_ATTEMPT'])
          assert os.environ['GITHUB_JOB'] == 'focused-rehearsal'
          receipt = {'source_sha': os.environ['DIAGNOSTIC_SOURCE_SHA'], 'compose_project': project,
                     'github_run_id': os.environ['GITHUB_RUN_ID'], 'github_run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
                     'github_job': 'focused-rehearsal', 'preexisting_backup_runs': 0, 'started_unix_ns': time.time_ns()}
          target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'rbac-focused-public' / 'backup-invocation.json'
          with target.open('x', encoding='utf-8') as stream:
              json.dump(receipt, stream, sort_keys=True, indent=2)
              stream.write('\n')
          PY
          ./test.sh rbac-backup-rehearsal

      - name: Verify same-invocation synthetic database cleanup before independent tests
        id: backup_cleanup
        if: ${{ always() && steps.stack.outcome == 'success' && !cancelled() }}
        shell: bash
        env:
          BACKUP_PROJECT: ${{ steps.ownership.outputs.compose_project }}
          BACKUP_OUTCOME: ${{ steps.backup.outcome }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, subprocess
          expected_variants = ('clean', 'delivery_started_historical_stamp', 'withdrawn_builder_residue')
          public = pathlib.Path(os.environ['RUNNER_TEMP']) / 'rbac-focused-public'
          phase = 'invocation'
          eligible = False
          verified_variants = []
          run_id = None
          def require(value):
              if not value:
                  raise ValueError('unverified')
          def unique(pairs):
              result = {}
              for key, value in pairs:
                  require(key not in result)
                  result[key] = value
              return result
          def load(path, maximum=2 * 1024 * 1024):
              require(path.is_file() and not path.is_symlink() and path.stat().st_size <= maximum)
              return json.loads(path.read_text(encoding='utf-8'), object_pairs_hook=unique)
          def command(*arguments):
              return subprocess.check_output(arguments, text=True, stderr=subprocess.PIPE, timeout=30).strip()
          try:
              project = os.environ['BACKUP_PROJECT']
              source = os.environ['DIAGNOSTIC_SOURCE_SHA']
              require(re.fullmatch(r'bifrost-test-[0-9a-f]{8}', project) is not None)
              require(re.fullmatch(r'[0-9a-f]{40}', source) is not None)
              require(os.environ['BACKUP_OUTCOME'] in ('success', 'failure'))
              invocation = load(public / 'backup-invocation.json', 4096)
              require(invocation == {
                  'source_sha': source, 'compose_project': project, 'github_run_id': os.environ['GITHUB_RUN_ID'],
                  'github_run_attempt': os.environ['GITHUB_RUN_ATTEMPT'], 'github_job': 'focused-rehearsal',
                  'preexisting_backup_runs': 0, 'started_unix_ns': invocation.get('started_unix_ns'),
              })
              require(os.environ['GITHUB_JOB'] == 'focused-rehearsal')
              require(type(invocation['started_unix_ns']) is int and invocation['started_unix_ns'] > 0)
              phase = 'source'
              require(command('git', 'rev-parse', 'HEAD') == source)
              require(not command('git', 'status', '--porcelain', '--untracked-files=all'))
              phase = 'run_directory'
              log_root = pathlib.Path('/tmp') / ('bifrost-' + project)
              require(log_root.is_dir() and not log_root.is_symlink())
              runs = list(log_root.glob('rbac-backup-*'))
              require(len(runs) == 1)
              run = runs[0]
              require(run.is_dir() and not run.is_symlink() and run.resolve().parent == log_root.resolve())
              match = re.fullmatch(r'rbac-backup-([0-9a-f]{32})', run.name)
              require(match is not None)
              run_id = match.group(1)
              require(run.stat().st_ctime_ns >= invocation['started_unix_ns'])
              phase = 'host_provenance'
              host = load(run / 'host-provenance.json')
              require(host.get('git_head') == source and host.get('compose_project') == project)
              require(host.get('clean_candidate') is True and host.get('synthetic_data_only') is True)
              require(host.get('worktree') == str(pathlib.Path.cwd()))
              require(host.get('phase_user_uid') == os.getuid() and host.get('phase_user_gid') == os.getgid())
              require(host.get('phase_entrypoint_recursive_chown') is False)
              expected_sources = ('test.sh', 'scripts/lib/test_helpers.sh', 'scripts/rehearse-mtg-rbac-backup.sh',
                  'scripts/rehearse-mtg-rbac-backup.py', 'scripts/rehearse-mtg-rbac-old-readers.sh',
                  'scripts/rehearse-mtg-rbac-old-readers.py')
              require(host.get('harness_source_sha256') == {
                  name: hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest() for name in expected_sources})
              os.environ['COMPOSE_PROJECT_NAME'] = project
              postgres = command('docker', 'compose', '-f', 'docker-compose.test.yml', 'ps', '-q', 'postgres')
              require(re.fullmatch(r'[0-9a-f]{64}', postgres) is not None)
              require(host.get('postgres_container') == postgres)
              require(host.get('postgres_image_id') == command('docker', 'inspect', '--format', '{{.Image}}', postgres))
              image = command('docker', 'image', 'inspect', 'bifrost-test-api-dev:latest', '--format', '{{.Id}}')
              require(host.get('runner_image_id') == image == load(public / 'image-identity.json')['image_id'])
              phase = 'variant_receipts'
              directories = [child for child in run.iterdir() if child.is_dir() or child.is_symlink()]
              require(1 <= len(directories) <= 3)
              names = {child.name for child in directories}
              require(names == set(expected_variants[:len(directories)]))
              for variant in expected_variants[:len(directories)]:
                  directory = run / variant
                  require(not directory.is_symlink() and directory.resolve().parent == run.resolve())
                  receipt_path = directory / 'receipt.json'
                  require(receipt_path.stat().st_mtime_ns >= invocation['started_unix_ns'])
                  receipt = load(receipt_path)
                  require(receipt.get('run_id') == run_id and receipt.get('variant') == variant)
                  require(receipt.get('contract_version') == 1 and receipt.get('synthetic_data_only') is True)
                  require(receipt.get('database_cleanup_verified') is True)
                  require(receipt.get('cleanup_failure_types', []) == [])
                  require(receipt.get('status') in ('passed', 'failed'))
                  require(all(re.fullmatch(r'bifrost_r2b_rehearsal_[0-9a-f]{12}', receipt.get(key, '')) is not None
                              for key in ('source_database', 'restored_database')))
                  verified_variants.append(variant)
              if os.environ['BACKUP_OUTCOME'] == 'success':
                  require(tuple(verified_variants) == expected_variants)
                  proof = load(run / 'proof.json')
                  require(proof.get('status') == 'passed' and proof.get('git_head') == source)
                  require(proof.get('compose_project') == project and set(proof.get('variants', {})) == set(expected_variants))
                  require(all(proof['variants'][variant].get('database_cleanup_verified') is True
                              and proof['variants'][variant].get('status') == 'passed' for variant in expected_variants))
              phase = 'remaining_synthetic_databases'
              # Read only the exact, provenance-bound test PostgreSQL container.
              # Credential values stay in its environment; only a count is returned.
              remaining = command('docker', 'exec', postgres, 'sh', '-eu', '-c',
                  'export PGUSER="${POSTGRES_USER:?}" PGPASSWORD="${POSTGRES_PASSWORD:?}" '
                  'PGDATABASE=postgres PGHOST=127.0.0.1 PGPORT=5432 PGOPTIONS="-c default_transaction_read_only=on"; '
                  'exec psql --no-password --tuples-only --no-align --command="'
                  "SELECT count(*) FROM pg_database WHERE datname ~ '^bifrost_r2b_rehearsal_[0-9a-f]{12}$'" + '"')
              require(remaining == '0')
              eligible = True
              phase = 'verified'
          except (ValueError, OSError, TypeError, KeyError, AttributeError, RecursionError, subprocess.SubprocessError):
              eligible = False
          receipt = {'schema_version': 1, 'purpose': 'independent-diagnostic-evidence-only',
                     'cleanup_verified_for_independent_tests': eligible, 'verification_stage': phase,
                     'backup_failure_waived': False, 'verified_variants': verified_variants}
          if eligible:
              receipt.update(source_sha=source, compose_project=project, rehearsal_run_id=run_id,
                             remaining_synthetic_databases=0)
          (public / 'backup-cleanup-proof.json').write_text(json.dumps(receipt, sort_keys=True, indent=2) + '\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('eligible=' + ('true' if eligible else 'false') + '\n')
          raise SystemExit(0 if eligible else 1)
          PY

      - name: Prove the OAuth single-use regression against frozen old source
        id: oauth_red_before
        if: ${{ !cancelled() && steps.stack.outcome == 'success' && steps.backup_cleanup.outputs.eligible == 'true' }}
        shell: bash
        env:
          RED_PROJECT: ${{ steps.ownership.outputs.compose_project }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, shutil, subprocess, tempfile, time, xml.etree.ElementTree as ET
          old_commit = '649e50916f78bc3eff818fdf8cefe215e28a76fc'
          auth_path = 'api/src/services/mcp_server/auth.py'
          test_path = 'api/tests/unit/services/mcp_server/test_auth_code_binding.py'
          test_name = 'test_concurrent_exchanges_have_exactly_one_winner'
          target = test_path.removeprefix('api/') + '::' + test_name
          public = pathlib.Path(os.environ['RUNNER_TEMP']) / 'rbac-focused-public'
          private = None
          process = None
          container_name = None
          container_id = None
          expected_red = False
          phase = 'inputs'
          receipt = {'schema_version': 1, 'purpose': 'oauth-single-use-red-before-diagnostic-only',
                     'expected_failure_verified': False, 'private_cleanup_verified': False,
                     'owned_container_removed': False, 'source_unchanged': False, 'image_unchanged': False}
          def require(value):
              if not value:
                  raise ValueError('unverified')
          def command(*args):
              return subprocess.check_output(args, stderr=subprocess.PIPE, text=True).strip()
          def sha(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()
          def inspect_owned():
              inspected = subprocess.run(['docker', 'inspect', container_name], capture_output=True, text=True)
              if inspected.returncode:
                  require(inspected.returncode == 1)
                  return None
              records = json.loads(inspected.stdout)
              require(len(records) == 1)
              item = records[0]
              require(item['Name'] == '/' + container_name)
              labels = item['Config']['Labels']
              require(labels.get('com.docker.compose.project') == project)
              require(labels.get('com.docker.compose.service') == 'test-runner')
              require(item['Config']['User'] == f'{os.getuid()}:{os.getgid()}')
              require(item['Image'] == expected_image and item['HostConfig']['AutoRemove'] is True)
              require(item['HostConfig']['Privileged'] is False and not item['HostConfig'].get('CapAdd'))
              mounts = item['Mounts']
              for destination, source, writable in (
                  ('/app/src/services/mcp_server/auth.py', private / 'auth.py', False),
                  ('/bifrost-oauth-red', private / 'output', True),
              ):
                  matches = [mount for mount in mounts if mount['Destination'] == destination]
                  require(len(matches) == 1)
                  require(matches[0]['Type'] == 'bind' and matches[0]['Source'] == str(source))
                  require(matches[0]['RW'] is writable)
              require(re.fullmatch(r'[0-9a-f]{64}', item['Id']) is not None)
              return item
          try:
              project = os.environ['RED_PROJECT']
              source = os.environ['DIAGNOSTIC_SOURCE_SHA']
              require(re.fullmatch(r'bifrost-test-[0-9a-f]{8}', project) is not None)
              require(re.fullmatch(r'[0-9a-f]{40}', source) is not None and os.getuid() != 0)
              require(command('git', 'rev-parse', 'HEAD') == source)
              require(not command('git', 'status', '--porcelain', '--untracked-files=all'))
              cleanup = json.loads((public / 'backup-cleanup-proof.json').read_text())
              require(cleanup.get('cleanup_verified_for_independent_tests') is True)
              require(cleanup.get('source_sha') == source and cleanup.get('compose_project') == project)
              image = json.loads((public / 'image-identity.json').read_text())
              require(image['source_sha'] == source)
              expected_image = image['image_id']
              require(re.fullmatch(r'sha256:[0-9a-f]{64}', expected_image) is not None)
              require(command('docker', 'image', 'inspect', 'bifrost-test-api-dev:latest', '--format', '{{.Id}}') == expected_image)
              runner_temp = pathlib.Path(os.environ['RUNNER_TEMP']).resolve(strict=True)
              private = pathlib.Path(tempfile.mkdtemp(prefix='rbac-oauth-red-', dir=runner_temp))
              require(private.resolve().parent == runner_temp and not private.is_symlink())
              output = private / 'output'
              output.mkdir(mode=0o700)
              # Preserve exact Git bytes. The only source override is this frozen file.
              frozen = subprocess.check_output(['git', 'show', old_commit + ':' + auth_path], stderr=subprocess.PIPE)
              (private / 'auth.py').write_bytes(frozen)
              old_blob = command('git', 'rev-parse', old_commit + ':' + auth_path)
              require(command('git', 'hash-object', str(private / 'auth.py')) == old_blob)
              auth_hash, test_hash = sha(pathlib.Path(auth_path)), sha(pathlib.Path(test_path))
              require(command('git', 'hash-object', auth_path) == command('git', 'rev-parse', 'HEAD:' + auth_path))
              require(command('git', 'hash-object', test_path) == command('git', 'rev-parse', 'HEAD:' + test_path))
              receipt.update(source_sha=source, source_tree=command('git', 'rev-parse', 'HEAD^{tree}'),
                  old_commit=old_commit, old_auth_blob=old_blob, old_auth_sha256=sha(private / 'auth.py'),
                  new_auth_sha256=auth_hash, new_test_sha256=test_hash, test_target=target,
                  new_test_blob=command('git', 'rev-parse', 'HEAD:' + test_path), image_id=expected_image,
                  compose_project=project, run_id=os.environ['GITHUB_RUN_ID'], run_attempt=os.environ['GITHUB_RUN_ATTEMPT'],
                  runner_uid=os.getuid(), runner_gid=os.getgid())
              container_name = project + '-oauth-red-' + private.name.removeprefix('rbac-oauth-red-')
              require(not command('docker', 'ps', '-aq', '--filter', 'name=^/' + container_name + '$'))
              environment = dict(os.environ, COMPOSE_PROJECT_NAME=project, LOG_DIR='/tmp/bifrost-' + project)
              # Bytecode is private so stale canonical pyc files cannot shadow the override.
              # Pre-pytest hashes also prove the new test and old source seen in-container.
              runner = (
                  'import hashlib,os,pathlib,sys; '
                  'assert os.getuid()!=0; '
                  'assert hashlib.sha256(pathlib.Path("/app/src/services/mcp_server/auth.py").read_bytes()).hexdigest()==sys.argv[1]; '
                  'assert hashlib.sha256(pathlib.Path("/app/' + test_path.removeprefix('api/') + '").read_bytes()).hexdigest()==sys.argv[2]; '
                  'import pytest; raise SystemExit(pytest.main(sys.argv[3:]))'
              )
              invocation = ['docker', 'compose', '-f', 'docker-compose.test.yml', '--profile', 'test',
                  'run', '--rm', '--no-deps', '--no-build', '--pull', 'never', '--name', container_name,
                  '--user', f'{os.getuid()}:{os.getgid()}',
                  '--volume', str(private / 'auth.py') + ':/app/src/services/mcp_server/auth.py:ro',
                  '--volume', str(output) + ':/bifrost-oauth-red',
                  '--env', 'PYTHONPYCACHEPREFIX=/bifrost-oauth-red/pycache',
                  'test-runner', 'python', '-c', runner, receipt['old_auth_sha256'], test_hash,
                  target, '--junitxml=/bifrost-oauth-red/result.xml', '-o', 'cache_dir=/bifrost-oauth-red/pytest-cache', '-v']
              phase = 'container_identity'
              with (private / 'console.log').open('xb') as console:
                  process = subprocess.Popen(invocation, env=environment, stdout=console, stderr=subprocess.STDOUT)
                  # Read back this one invocation; never retry the test command.
                  for _ in range(100):
                      item = inspect_owned()
                      if item is not None:
                          container_id = item['Id']
                          break
                      if process.poll() is not None:
                          break
                      time.sleep(0.1)
                  exit_code = process.wait()
              require(container_id is not None)
              receipt.update(observed_container_image_id=expected_image, single_read_only_source_override=True,
                             pytest_exit_code=exit_code)
              phase = 'exact_expected_failure'
              require(exit_code == 1)
              report = output / 'result.xml'
              require(report.is_file() and not report.is_symlink() and report.stat().st_size <= 2 * 1024 * 1024)
              root = ET.parse(report).getroot()
              suites = [root] if root.tag == 'testsuite' else list(root.iter('testsuite'))
              require(len(suites) == 1)
              counts = {key: int(suites[0].get(key, '-1')) for key in ('tests', 'failures', 'errors', 'skipped')}
              require(counts == {'tests': 1, 'failures': 1, 'errors': 0, 'skipped': 0})
              cases = list(root.iter('testcase'))
              require(len(cases) == 1 and cases[0].get('name') == test_name)
              require(cases[0].get('classname') == 'tests.unit.services.mcp_server.test_auth_code_binding')
              require(not list(root.iter('error')) and not list(root.iter('skipped')))
              failures = list(root.iter('failure'))
              require(len(failures) == 1 and failures[0].get('type') in (None, 'AssertionError'))
              message = failures[0].get('message', '')
              require(message.splitlines()[0] == 'assert [200, 200] == [200, 400]')
              require('assert [200, 200] == [200, 400]' in (failures[0].text or ''))
              receipt.update(counts=counts, expected_observed_status_codes=[200, 200], required_fixed_status_codes=[200, 400],
                             expected_failure_verified=True)
              phase = 'source_and_image_readback'
              require(command('git', 'rev-parse', 'HEAD') == source)
              require(not command('git', 'status', '--porcelain', '--untracked-files=all'))
              require(sha(pathlib.Path(auth_path)) == auth_hash and sha(pathlib.Path(test_path)) == test_hash)
              require(command('docker', 'image', 'inspect', 'bifrost-test-api-dev:latest', '--format', '{{.Id}}') == expected_image)
              receipt.update(source_unchanged=True, image_unchanged=True)
              expected_red = True
              phase = 'verified'
          except (ValueError, OSError, TypeError, KeyError, IndexError, AttributeError, ET.ParseError, subprocess.SubprocessError):
              expected_red = False
          finally:
              try:
                  if container_name is not None:
                      item = inspect_owned()
                      if item is not None:
                          require(container_id is None or item['Id'] == container_id)
                          command('docker', 'rm', '--force', item['Id'])
                      require(not command('docker', 'ps', '-aq', '--filter', 'name=^/' + container_name + '$'))
                      receipt['owned_container_removed'] = True
                  if process is not None and process.poll() is None:
                      process.wait(timeout=30)
                  if private is not None:
                      require(private.resolve().parent == runner_temp and not private.is_symlink())
                      shutil.rmtree(private)
                      require(not private.exists())
                      receipt['private_cleanup_verified'] = True
              except (ValueError, OSError, TypeError, KeyError, subprocess.SubprocessError):
                  expected_red = False
                  phase = 'cleanup_unverified'
              receipt['verification_stage'] = phase
              receipt['verified'] = expected_red and receipt['owned_container_removed'] and receipt['private_cleanup_verified']
              with (public / 'oauth-single-use-red-before.json').open('x', encoding='utf-8') as stream:
                  json.dump(receipt, stream, sort_keys=True, indent=2)
                  stream.write('\n')
          # Unexpected failures, skips, collection errors or changed inputs fail closed.
          raise SystemExit(0 if receipt['verified'] else 1)
          PY

      - name: Run explicit bridge and authorization unit suites
