name: Isolated Rust common owner foundation
on:
  push:
    branches: [spike/go-first-class-g0]
    paths:
      - spikes/go-native/owner-rs/**
      - spikes/go-native/scripts/owner-foundation-check.sh
      - spikes/go-native/scripts/owner-codec-lock.sh
      - .github/workflows/runtime-owner-foundation-spike.yml
  workflow_dispatch:
    inputs:
      codec_lock:
        description: Generate a reviewable owner lock proposal with the existing strict wire codec
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  owner-foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Exact source and dependency bootstrap, offline Rust checks
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain --untracked-files=all)"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git -c credential.helper= -c http.extraheader= fetch origin main
          git merge-base --is-ancestor origin/main HEAD
          mkdir -p "$RUNNER_TEMP/owner-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/owner-evidence/source.txt"
          git rev-parse HEAD^{tree} >> "$RUNNER_TEMP/owner-evidence/source.txt"
          bash spikes/go-native/scripts/owner-foundation-check.sh "$RUNNER_TEMP/owner-evidence"
      - name: Resolve proposed codec integration lock without executing application code
        if: github.event_name == 'workflow_dispatch' && inputs.codec_lock
        run: bash spikes/go-native/scripts/owner-codec-lock.sh "$RUNNER_TEMP/owner-evidence"
      - name: Retain source and dependency evidence, including failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-owner-foundation-${{ github.sha }}
          path: ${{ runner.temp }}/owner-evidence
          if-no-files-found: error
          retention-days: 14
