name: Dockerfile Policy

on:
  pull_request:
    branches: [main]
    paths:
      - '**/Dockerfile*'
      - '**/*.Dockerfile'
      - '**/*.dockerfile'
      - '**/Containerfile*'
      - '**/.dockerignore'
      - '**/*.dockerignore'
      - .dockerignore
      - droast.toml
      - .github/workflows/dockerfile-policy.yml
  push:
    branches: [main]
    paths:
      - '**/Dockerfile*'
      - '**/*.Dockerfile'
      - '**/*.dockerfile'
      - '**/Containerfile*'
      - '**/.dockerignore'
      - '**/*.dockerignore'
      - .dockerignore
      - droast.toml
      - .github/workflows/dockerfile-policy.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Roast platform Dockerfiles
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Dockerfile Roast
        id: install-droast
        env:
          DROAST_VERSION: "sha-23ea8bf7c9d3ee65d6a0ccec3d76d4566591ad3c"
          DROAST_LINUX_X86_64_SHA256: 592e9ad6bb5734bea6d951791ef8de54e8e9d6b1243c63aab544574ceb0784b5
        run: |
          set -euo pipefail
          install_path="$RUNNER_TEMP/droast"
          curl --proto '=https' --proto-redir '=https' --fail --location --silent --show-error \
            "https://github.com/MTG-Thomas/dockerfile-roast/releases/download/${DROAST_VERSION}/droast-linux-x86_64" \
            --output "$install_path"
          echo "${DROAST_LINUX_X86_64_SHA256}  ${install_path}" | sha256sum -c -
          chmod +x "$install_path"
          echo "bin=$install_path" >> "$GITHUB_OUTPUT"

      - name: Lint platform Dockerfiles
        run: >-
          ${{ steps.install-droast.outputs.bin }}
          --config droast.toml
          --format github
          --no-fail
          .
