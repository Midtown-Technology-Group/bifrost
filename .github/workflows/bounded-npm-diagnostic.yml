name: Bounded npm build diagnostic

on:
  push:
    branches: [diagnostic/finn-npm-install-observer-20261015]
    paths: [.github/workflows/bounded-npm-diagnostic.yml]

permissions:
  contents: read

concurrency:
  group: bounded-npm-diagnostic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  probe:
    if: >-
      github.repository == 'Midtown-Technology-Group/bifrost' &&
      github.ref == 'refs/heads/diagnostic/finn-npm-install-observer-20261015' &&
      github.event_name == 'push' &&
      github.event.before == '696537b30a03321aa64aa2561d174d6a3752f0d8'
    runs-on: ubuntu-latest
    # Step budgets leave at least four minutes beyond normal cleanup/upload.
    timeout-minutes: 45
    env:
      PROBE_SOURCE: ${{ github.sha }}
    steps:
      - name: Checkout exact probe
        timeout-minutes: 2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node
        timeout-minutes: 2
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"
      - name: Bind source and initially empty task project
        id: bind
        timeout-minutes: 1
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PROBE_SOURCE"
          test "$(git rev-parse HEAD^)" = 315f0b36649fda645182d647aa35c55cbc670708
          test "$(git rev-parse HEAD^^)" = 696537b30a03321aa64aa2561d174d6a3752f0d8
          git diff --quiet 315f0b36649fda645182d647aa35c55cbc670708 HEAD -- api/src/services/solutions/app_build.py api/tests/unit/test_solution_app_build.py
          test "$(git diff --name-only HEAD^ HEAD)" = .github/workflows/bounded-npm-diagnostic.yml
          test -z "$(git status --porcelain)"
          source scripts/lib/test_helpers.sh
          export PROBE_PROJECT="$(compute_project_name .)"
          python3 - <<'PYCODE'
          import json, os, pathlib, subprocess
          project = os.environ['PROBE_PROJECT']
          counts = {}
          for kind in ('container', 'network', 'volume'):
              argv = ['docker', 'ps', '-aq'] if kind == 'container' else ['docker', kind, 'ls', '-q']
              result = subprocess.run(argv + ['--filter', 'label=com.docker.compose.project=' + project], capture_output=True, text=True, check=True, timeout=20)
              counts[kind] = len(result.stdout.split())
          if any(counts.values()):
              raise RuntimeError('Task project already has resources; ownership not acquired')
          output = pathlib.Path('.npm-probe-evidence')
          output.mkdir(mode=0o700)
          source_file = output / 'source.json'
          source_file.write_text(json.dumps({'source': os.environ['PROBE_SOURCE'], 'project': project, 'initial_resources': counts}))
          source_file.chmod(0o600)
          PYCODE
          printf 'PROBE_PROJECT=%s\nPROBE_LOG_DIR=/tmp/bifrost-%s\nBIND_OK=true\n' "$PROBE_PROJECT" "$PROBE_PROJECT" >> "$GITHUB_ENV"
      - name: Start isolated repository test stack
        timeout-minutes: 15
        run: ./test.sh stack up
      - name: Run builder regressions before qualification
        id: regressions
        timeout-minutes: 4
        run: ./test.sh tests/unit/test_solution_app_build.py -m "" -v
      - name: Run API quality
        id: quality
        timeout-minutes: 4
        run: ./test.sh quality api
      - name: One discriminating fixture qualification
        id: fixture
        timeout-minutes: 3
        run: ./test.sh 'tests/e2e/platform/test_solution_accountability_recovery.py::test_recovery_releases_obligation_without_redeploying[True]' -v --durations=0
      - name: Retain bounded scheduler observation before teardown
        if: always()
        timeout-minutes: 1
        env:
          REGRESSIONS: ${{ steps.regressions.outcome }}
          QUALITY: ${{ steps.quality.outcome }}
          FIXTURE: ${{ steps.fixture.outcome }}
        run: |
          set -euo pipefail
          if [ "${BIND_OK:-}" = true ]; then
            source scripts/lib/test_helpers.sh
            export LOG_DIR="$PROBE_LOG_DIR"
            export_logs "$PROBE_PROJECT" docker-compose.test.yml
          fi
          python3 - <<'PYCODE'
          import ast, json, os, pathlib, re, subprocess
          output = pathlib.Path('.npm-probe-evidence')
          output.mkdir(mode=0o700, exist_ok=True)
          records, retained_bytes = [], 0
          status, truncated = 'log_missing', False
          source = pathlib.Path('api/src/services/solutions/app_build.py')
          if source.is_file() and os.environ.get('BIND_OK') == 'true':
              tree = ast.parse(source.read_text())
              assignment = next(n for n in tree.body if isinstance(n, ast.Assign) and any(isinstance(t, ast.Name) and t.id == '_NPM_ERROR_CODES' for t in n.targets))
              codes = ast.literal_eval(assignment.value.args[0])
              # Reuse the source version grammar, not a more permissive copy.
              version_function = next(n for n in tree.body if isinstance(n, ast.FunctionDef) and n.name == '_build_tool_version')
              version_call = next(n for n in ast.walk(version_function) if isinstance(n, ast.Call) and isinstance(n.func, ast.Attribute) and n.func.attr == 'fullmatch')
              version = ast.literal_eval(version_call.args[0])
              pattern = re.compile(r'App build step=npm_install exit_status=(-?\d{1,11}) npm_code=(unknown|' + '|'.join(re.escape(c) for c in sorted(codes)) + r') node_version=(unknown|' + version + r') npm_version=(unknown|' + version + r') stderr_state=(absent|empty|present) scan_truncated=(true|false) code_line_class=(none|allowlisted|numeric|unlisted|conflicting|overflow) format_class=(plain|sgr|alternate_heading|mixed|unmatched) exit_handler_never_called=(true|false)$')
              logfile = pathlib.Path(os.environ['PROBE_LOG_DIR']) / 'scheduler.log'
              if logfile.is_file():
                  status = 'log_present_no_matches'
                  with logfile.open('rb') as stream:
                      data = stream.read(2 * 1024 * 1024 + 1)
                  truncated = len(data) > 2 * 1024 * 1024
                  lines = data[:2 * 1024 * 1024].splitlines()
                  if truncated:
                      lines = lines[:-1]
                  for line in lines:
                      if len(line) > 1024:
                          continue
                      match = pattern.search(line.decode('utf-8', errors='replace'))
                      if match:
                          record = match.group()
                          if len(record.encode('ascii')) > 512:
                              continue
                          size = len(record.encode('ascii')) + 1
                          if len(records) >= 16 or retained_bytes + size > 4096:
                              truncated = True
                              break
                          records.append(record)
                          retained_bytes += size
                  if records:
                      status = 'captured'
          result = {'source': os.environ['PROBE_SOURCE'], 'project': os.environ.get('PROBE_PROJECT', 'unknown'), 'observation': status, 'truncated': truncated, 'records': records, 'record_count': len(records), 'retained_record_bytes': retained_bytes, 'outcomes': {k: os.environ[k] for k in ('REGRESSIONS', 'QUALITY', 'FIXTURE')}}
          encoded = json.dumps(result, indent=2)
          if len(encoded.encode('utf-8')) > 8192:
              raise RuntimeError('Observer artifact exceeds hard byte cap')
          observation = output / 'observation.json'
          observation.write_text(encoded)
          observation.chmod(0o600)
          if os.environ.get('BIND_OK') == 'true':
              inventory = {}
              for kind in ('container', 'network', 'volume'):
                  argv = ['docker', 'ps', '-aq'] if kind == 'container' else ['docker', kind, 'ls', '-q']
                  found = subprocess.run(argv + ['--filter', 'label=com.docker.compose.project=' + os.environ['PROBE_PROJECT']], capture_output=True, text=True, check=True, timeout=15)
                  inventory[kind] = found.stdout.split()
              # Anonymous mounted volumes also belong to these task containers.
              volumes = set(inventory['volume'])
              if len(inventory['container']) > 64:
                  raise RuntimeError('Task container inventory exceeds bound')
              for container in inventory['container']:
                  mounts = subprocess.run(['docker', 'inspect', '--format', '{{range .Mounts}}{{if eq .Type "volume"}}{{println .Name}}{{end}}{{end}}', container], capture_output=True, text=True, check=True, timeout=5)
                  volumes.update(mounts.stdout.split())
              inventory['volume'] = sorted(volumes)
              encoded = json.dumps(inventory)
              if len(encoded.encode('utf-8')) > 65536:
                  raise RuntimeError('Owned resource inventory exceeds bound')
              owned_file = output / 'ownership.json'
              owned_file.write_text(encoded)
              owned_file.chmod(0o600)
          PYCODE
      - name: Tear down owned test stack
        if: always()
        timeout-minutes: 5
        run: |
          if [ "${BIND_OK:-}" = true ]; then
            ./test.sh stack down
          fi
      - name: Independently verify task cleanup
        if: always()
        timeout-minutes: 1
        run: |
          python3 - <<'PYCODE'
          import json, os, pathlib, subprocess
          output = pathlib.Path('.npm-probe-evidence')
          output.mkdir(mode=0o700, exist_ok=True)
          owned = os.environ.get('BIND_OK') == 'true'
          counts = {}
          inventory_missing = False
          if owned:
              inventory_file = output / 'ownership.json'
              inventory_missing = not inventory_file.is_file()
              inventory = json.loads(inventory_file.read_text()) if not inventory_missing else {}
              for kind in ('container', 'network', 'volume'):
                  argv = ['docker', 'ps', '-aq'] if kind == 'container' else ['docker', kind, 'ls', '-q']
                  result = subprocess.run(argv + ['--filter', 'label=com.docker.compose.project=' + os.environ['PROBE_PROJECT']], capture_output=True, text=True, check=True, timeout=15)
                  remaining = set(result.stdout.split())
                  # Inspect global IDs without retaining unrelated resource data.
                  all_found = subprocess.run(argv, capture_output=True, text=True, check=True, timeout=15)
                  remaining.update(set(inventory.get(kind, [])) & set(all_found.stdout.split()))
                  counts[kind] = len(remaining)
          receipt = {'source': os.environ['PROBE_SOURCE'], 'project': os.environ.get('PROBE_PROJECT', 'unknown'), 'ownership_acquired': owned, 'remaining_resources': counts, 'inventory_missing': inventory_missing, 'cleanup': 'verified_empty' if owned and not inventory_missing and not any(counts.values()) else 'not_started' if not owned else 'incomplete'}
          cleanup = output / 'cleanup.json'
          cleanup.write_text(json.dumps(receipt, indent=2))
          cleanup.chmod(0o600)
          if inventory_missing or any(counts.values()):
              raise RuntimeError('Owned task resources remain')
          PYCODE
      - name: Validate explicit safe artifact files
        id: safe
        if: always()
        timeout-minutes: 1
        run: |
          python3 - <<'PYCODE'
          import ast, json, os, pathlib, re, stat
          output = pathlib.Path('.npm-probe-evidence')
          caps = {'source.json': 4096, 'observation.json': 8192, 'ownership.json': 65536, 'cleanup.json': 4096}
          documents = {}
          for name, cap in caps.items():
              path = output / name
              info = path.lstat()
              assert stat.S_ISREG(info.st_mode) and info.st_size <= cap
              documents[name] = json.loads(path.read_text())
          source, observation, ownership, cleanup = (documents[name] for name in caps)
          resources = {'container', 'network', 'volume'}
          assert set(source) == {'source', 'project', 'initial_resources'}
          assert set(source['initial_resources']) == resources
          assert all(type(v) is int and v == 0 for v in source['initial_resources'].values())
          assert re.fullmatch(r'[a-z0-9][a-z0-9_-]{0,127}', source['project'])
          assert source['source'] == os.environ['PROBE_SOURCE']
          assert source['project'] == os.environ['PROBE_PROJECT']
          assert set(observation) == {'source', 'project', 'observation', 'truncated', 'records', 'record_count', 'retained_record_bytes', 'outcomes'}
          assert observation['observation'] in {'log_missing', 'log_present_no_matches', 'captured'}
          assert type(observation['truncated']) is bool
          records = observation['records']
          assert type(records) is list and len(records) <= 16
          tree = ast.parse(pathlib.Path('api/src/services/solutions/app_build.py').read_text())
          assignment = next(n for n in tree.body if isinstance(n, ast.Assign) and any(isinstance(t, ast.Name) and t.id == '_NPM_ERROR_CODES' for t in n.targets))
          codes = ast.literal_eval(assignment.value.args[0])
          function = next(n for n in tree.body if isinstance(n, ast.FunctionDef) and n.name == '_build_tool_version')
          call = next(n for n in ast.walk(function) if isinstance(n, ast.Call) and isinstance(n.func, ast.Attribute) and n.func.attr == 'fullmatch')
          version = ast.literal_eval(call.args[0])
          pattern = re.compile(r'App build step=npm_install exit_status=(-?\d{1,11}) npm_code=(unknown|' + '|'.join(re.escape(c) for c in sorted(codes)) + r') node_version=(unknown|' + version + r') npm_version=(unknown|' + version + r') stderr_state=(absent|empty|present) scan_truncated=(true|false) code_line_class=(none|allowlisted|numeric|unlisted|conflicting|overflow) format_class=(plain|sgr|alternate_heading|mixed|unmatched) exit_handler_never_called=(true|false)')
          assert all(type(record) is str and len(record.encode('ascii')) <= 512 and pattern.fullmatch(record) for record in records)
          for record in records:
              fields = dict(item.split('=', 1) for item in record.split()[2:])
              if fields['scan_truncated'] == 'true' or fields['code_line_class'] != 'allowlisted':
                  assert fields['npm_code'] == 'unknown'
              if fields['format_class'] == 'unmatched':
                  assert fields['code_line_class'] == 'none'
          record_bytes = sum(len(record.encode('ascii')) + 1 for record in records)
          assert type(observation['record_count']) is int and type(observation['retained_record_bytes']) is int
          assert observation['record_count'] == len(records)
          assert observation['retained_record_bytes'] == record_bytes <= 4096
          assert (observation['observation'] == 'captured') == bool(records)
          assert set(observation['outcomes']) == {'REGRESSIONS', 'QUALITY', 'FIXTURE'}
          assert all(v in {'success', 'failure', 'skipped', 'cancelled'} for v in observation['outcomes'].values())
          assert set(ownership) == resources
          for kind, identifiers in ownership.items():
              assert type(identifiers) is list and len(identifiers) <= 256
              assert all(type(value) is str and re.fullmatch(r'[a-zA-Z0-9_.-]{1,128}', value) for value in identifiers)
          assert set(cleanup) == {'source', 'project', 'ownership_acquired', 'remaining_resources', 'inventory_missing', 'cleanup'}
          assert type(cleanup['ownership_acquired']) is bool and type(cleanup['inventory_missing']) is bool
          assert set(cleanup['remaining_resources']) == resources
          assert all(type(v) is int and 0 <= v <= 256 for v in cleanup['remaining_resources'].values())
          assert cleanup['cleanup'] in {'verified_empty', 'incomplete', 'not_started'}
          if cleanup['cleanup'] == 'verified_empty':
              assert cleanup['ownership_acquired'] and not cleanup['inventory_missing'] and not any(cleanup['remaining_resources'].values())
          for document in (observation, cleanup):
              assert document['source'] == source['source'] and document['project'] == source['project']
          PYCODE
      - name: Retain bounded diagnostic evidence
        if: always() && steps.safe.outcome == 'success'
        timeout-minutes: 2
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bounded-npm-diagnostic-${{ github.sha }}
          path: |
            .npm-probe-evidence/source.json
            .npm-probe-evidence/observation.json
            .npm-probe-evidence/ownership.json
            .npm-probe-evidence/cleanup.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
