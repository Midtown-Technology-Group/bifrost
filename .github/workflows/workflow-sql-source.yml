name: Workflow SQL source gate

on:
  push:
    branches: [rust/workflow-sql-persistence]
    paths:
      - 'core-rs/**'
      - 'api/tests/parity/test_workflow_sql.py'
      - 'scripts/ci/workflow-sql-source.sh'
      - '.github/workflows/workflow-sql-source.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: Format patch only, or verify exact source and characterize SQL order
        type: choice
        options: [verify, format]
        default: verify
        required: true

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Supported isolated source gate
        env:
          # Exact push candidate is now verified after the reviewed formatter patch.
          SQL_SOURCE_MODE: ${{ github.event_name == 'push' && 'verify' || inputs.mode }}
        run: bash scripts/ci/workflow-sql-source.sh "$SQL_SOURCE_MODE"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: workflow-sql-source
          path: ${{ env.WORKFLOW_SQL_SOURCE_EVIDENCE }}
          if-no-files-found: error
          retention-days: 14
