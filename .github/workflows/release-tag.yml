name: Release tag

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      main_ci_run:
        description: Successful exact main-push CI run for recovery (never a tag input)
        required: true
        type: string

concurrency:
  group: release-publication
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: read
  actions: write

jobs:
  publish:
    if: >-
      github.repository == 'Midtown-Technology-Group/bifrost' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.conclusion == 'success'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the approved release and publish its exact source
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN: ${{ github.event.workflow_run.id || inputs.main_ci_run }}
        run: |
          set -euo pipefail
          [[ "$CI_RUN" =~ ^[0-9]+$ ]]
          source_sha="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN" --jq .head_sha)"
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
          python3 scripts/release/automatic-release.py publish --source "$source_sha" --run-id "$CI_RUN"
