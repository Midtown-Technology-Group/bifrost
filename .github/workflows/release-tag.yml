name: Release tag

# Zero-touch tagging: closing the "Release vX.Y.Z" issue as completed tags main
# at that version. The existing CI tag flow then builds signed images and opens
# the GitHub Release draft. Guards: the tag must not exist, main HEAD checks must
# be green, and the computed next version must still match the issue title.
# See docs/VERSIONING.md.

on:
  issues:
    types: [closed]

concurrency:
  group: release-tag
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tag:
    name: Tag the release
    if: >-
      github.repository == 'Midtown-Technology-Group/bifrost' &&
      startsWith(github.event.issue.title, 'Release v') &&
      github.event.issue.state_reason == 'completed'
    runs-on: ubuntu-latest
    permissions:
      actions: read # read check-runs to gate tagging on green main
      contents: write # create the release tag ref via the git API
      issues: write # comment the tagged version on the release issue
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve and guard the version
        id: guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          set -euo pipefail
          version="$(printf '%s' "$ISSUE_TITLE" | sed -E 's/^Release (v[0-9]+\.[0-9]+\.[0-9]+).*/\1/')"
          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Not a semver release issue; nothing to tag."
            exit 0
          fi
          if git ls-remote --tags origin "$version" | grep -q "$version"; then
            echo "::error::$version already exists on origin."
            exit 1
          fi
          computed="$(./scripts/release/next-release-version.sh || true)"
          if [[ -n "$computed" && "$computed" != "$version" ]]; then
            echo "::error::Computed next version is $computed but the issue says $version; re-draft before tagging."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Verify main HEAD checks are green
        if: steps.guard.outputs.version != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          conclusion="$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha/check-runs?per_page=100" \
            --jq '[.check_runs[] | select(.name != "MTG Queue Authorization") | .conclusion]
                  | if length == 0 then "none"
                    elif any(. != "success" and . != "skipped" and . != "neutral") then "failure"
                    else "success" end')"
          if [[ "$conclusion" != "success" ]]; then
            echo "::error::Main HEAD checks are not green ($conclusion); not tagging."
            exit 1
          fi

      - name: Create the tag
        if: steps.guard.outputs.version != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.guard.outputs.version }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$VERSION" -f sha="$sha" --jq '.ref'

      - name: Comment on the issue
        if: steps.guard.outputs.version != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.guard.outputs.version }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          gh issue comment "$ISSUE_NUMBER" --body \
            "Tagged \`$VERSION\` on \`$(git rev-parse --short HEAD)\`. CI is building the release; edit the GitHub Release draft notes (Fixed vulnerabilities + upstream baseline)."
