name: Notify ecosystem knowledge

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  notify:
    if: github.repository == 'Midtown-Technology-Group/bifrost' && vars.OPENWIKI_MAINTENANCE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Notify the existing private documentation and knowledge receivers
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          OPENWIKI_DISPATCH_TOKEN: ${{ secrets.OPENWIKI_DISPATCH_TOKEN }}
        with:
          script: |
            const token = process.env.OPENWIKI_DISPATCH_TOKEN;
            if (!token) throw new Error('OPENWIKI_DISPATCH_TOKEN is not enrolled; no source event was sent.');
            const before = context.payload.before;
            const commit = context.sha;
            let sourceChanged = true;
            if (/^[0-9a-f]{40}$/.test(before) && !/^0+$/.test(before)) {
              const comparison = await github.rest.repos.compareCommitsWithBasehead({
                ...context.repo, basehead: `${before}...${commit}`
              });
              const files = comparison.data.files ?? [];
              // GitHub caps this list at 300. Treat truncation conservatively.
              sourceChanged = files.length >= 300 || files.some(file => {
                if (!file || typeof file !== 'object' || typeof file.filename !== 'string' || file.filename.length === 0) return true;
                const candidates = [file.filename, file.previous_filename];
                if (candidates.some(path => path !== undefined && (typeof path !== 'string' || path.length === 0))) return true;
                const paths = candidates.filter(path => typeof path === 'string');
                return paths.length === 0 || paths.some(path => {
                  const parts = path.split('/');
                  const safePath = path.startsWith('openwiki/') &&
                    parts.every(part => part && part !== '.' && part !== '..');
                  const generated = safePath && (
                    (/^openwiki\/.+\.md$/i).test(path) ||
                    (/^openwiki\/\.claims\/.+\.json$/).test(path) ||
                    path === 'openwiki/.last-update.json' ||
                    path === 'openwiki/.page-manifest.json'
                  );
                  return !generated || path === 'openwiki/INSTRUCTIONS.md';
                });
              });
            }
            const events = ['bifrost-docs-refresh'];
            if (sourceChanged) events.push('openwiki-source-updated');
            for (const event_type of events) {
              const response = await fetch('https://api.github.com/repos/MTG-Thomas/bifrost-ops/dispatches', {
                method: 'POST',
                headers: {Authorization: `Bearer ${token}`, Accept: 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28', 'Content-Type': 'application/json'},
                body: JSON.stringify({event_type, client_payload: {member: 'bifrost', commit}})
              });
              if (response.status !== 204) throw new Error(`Knowledge notification failed: HTTP ${response.status}`);
              core.notice(`Accepted ${event_type} notification for ${commit}`);
            }
