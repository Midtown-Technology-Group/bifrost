[databases]
bifrost_wex_primer = host=postgres port=5432 dbname=bifrost_wex_primer

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 5432
unix_socket_dir =
auth_type = plain
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
max_client_conn = 16
default_pool_size = 2
min_pool_size = 0
reserve_pool_size = 0
