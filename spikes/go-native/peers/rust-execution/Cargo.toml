[package]
name = "bifrost-execution-wire-spike"
version = "0.0.0"
edition = "2024"
rust-version = "1.98.1"
license = "AGPL-3.0-only"
publish = false

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"

[dev-dependencies]
# Retain fixture payload field order for its declared byte-level receipt preimage.
# This adds no registry package and is used only by specification tests.
serde_json = { version = "=1.0.151", features = ["raw_value"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
