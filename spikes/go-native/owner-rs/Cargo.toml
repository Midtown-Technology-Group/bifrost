[package]
name = "bifrost-isolated-owner-spike"
version = "0.0.0"
edition = "2024"
rust-version = "1.98.1"
license = "AGPL-3.0-only"
publish = false

[dependencies]
bifrost-execution-wire-spike = { path = "../peers/rust-execution" }
libc = "=0.2.190"
rustix = { version = "=1.1.4", default-features = false, features = ["net", "std"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
sqlx = { version = "=0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-ring-native-roots"] }
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "macros", "time"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
