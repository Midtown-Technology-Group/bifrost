[package]
name = "bifrost-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
telemetry-tls = []
admission-transport-prototype = ["dep:http-body-util", "dep:hyper", "dep:hyper-util", "dep:rustls", "dep:serde", "dep:tokio-rustls"]

[[example]]
name = "admission_transport_prototype"
required-features = ["admission-transport-prototype"]

[[test]]
name = "telemetry_tls"
required-features = ["telemetry-tls"]

[dependencies]
bifrost-contracts.workspace = true
bifrost-domain.workspace = true
bifrost-db.workspace = true
axum.workspace = true
http-body-util = { workspace = true, optional = true }
hyper = { workspace = true, optional = true }
hyper-util = { workspace = true, optional = true }
opentelemetry.workspace = true
opentelemetry_sdk.workspace = true
opentelemetry-otlp.workspace = true
rustls = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
thiserror.workspace = true
tokio.workspace = true
tokio-rustls = { workspace = true, optional = true }
tonic.workspace = true
tower.workspace = true
tracing.workspace = true
tracing-opentelemetry.workspace = true
tracing-subscriber.workspace = true
url.workspace = true

[dev-dependencies]
opentelemetry-proto = { version = "=0.33.0", default-features = false, features = ["gen-tonic", "trace", "metrics"] }
tokio-stream = { version = "=0.1.19", features = ["net"] }
tonic = { workspace = true, features = ["router"] }

[lints]
workspace = true
