; REVIEW INPUT ONLY. Private users.txt is generated only after approval.
; No DB user/password override: authenticated client identity reaches PostgreSQL.
[databases]
bifrost_test = host=postgres port=5432 dbname=bifrost_test

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 5432
unix_socket_dir =
auth_type = plain
auth_file = /private/users.txt
pool_mode = transaction
max_client_conn = 32
default_pool_size = 4
reserve_pool_size = 0
ignore_startup_parameters = extra_float_digits
server_reset_query = DISCARD ALL
pidfile = /tmp/pgbouncer.pid
